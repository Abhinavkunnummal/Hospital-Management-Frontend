<div class="page">

  <form [formGroup]="loginForm"
        class="login-card"
        (ngSubmit)="loginData()">

    <h2>🔐 Login</h2>
    <p class="subtitle">Access your dashboard</p>

    <!-- Email -->
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="Enter email">

      <small *ngIf="loginForm.controls.email.touched && loginForm.controls.email.invalid">
        Email is required
      </small>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Enter password">

      <small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
        Password must be at least 4 characters
      </small>
    </div>

    <button type="submit" [disabled]="loginForm.invalid">
      Login
    </button>

    <div class="links">
      <a routerLink="/register">👤 Patient Register</a>
      <a routerLink="/register-doctor">👨‍⚕️ Doctor Register</a>
    </div>

  </form>

</div>
